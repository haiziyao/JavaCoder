          - region [ref=f1e550]:
            - generic [ref=f1e551]:
              - paragraph [ref=f1e552]: What is a skill?
              - paragraph [ref=f1e553]: Skills are small, sharp instructions you hand your coding agent so it works the way a senior engineer would. Install the ones you want, type a slash command, and the agent follows a process you actually trust.
              - generic [ref=f1e554]:
                - generic [ref=f1e555]:
                  - heading "The problem" [level=3] [ref=f1e556]
                  - paragraph [ref=f1e557]: An agent is only as good as the process you give it. Left to guess, it writes plausible code that quietly rots the codebase.
