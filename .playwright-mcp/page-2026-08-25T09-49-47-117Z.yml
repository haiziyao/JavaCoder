            - generic [ref=e250]:
              - article [ref=e252]:
                - heading [level=2] [ref=e253]:
                  - link "What it does" [ref=e254] [cursor=pointer]:
                    - /url: "#what-it-does"
                - paragraph [ref=e255]:
                  - code [ref=e256]: grill-me
                  - text: takes a
                  - strong [ref=e257]: loose idea
                  - text: "and interviews you until you can commit to it. You do not need a worked-out plan to start: producing one is what the"
                  - link "session" [ref=e258] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/session
                  - text: is for. It asks in
                  - strong [ref=e259]: rounds
                  - text: ": each round is the whole"
                  - strong [ref=e260]: frontier
                  - text: (every question whose prerequisites you have already settled), so you are never asked something that hinges on an answer it hasn't heard yet.
                - paragraph [ref=e261]:
                  - text: It is
                  - strong [ref=e262]:
                    - link "stateless" [ref=e263] [cursor=pointer]:
                      - /url: /ai-coding-dictionary/stateless
                  - text: . It writes no files and leaves no workspace behind. The only thing it leaves is a sharper version of the idea, in your own head.
                - heading [level=2] [ref=e264]:
                  - link "When to reach for it" [ref=e265] [cursor=pointer]:
                    - /url: "#when-to-reach-for-it"
                - paragraph [ref=e266]:
                  - text: You invoke this by typing
                  - code [ref=e267]: /grill-me
                  - text: ; the
                  - link "agent" [ref=e268] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/agent
                  - text: won't reach for it on its own. Start it in a
                  - strong [ref=e269]: fresh conversation
                  - text: ", not on top of a plan you already had an agent write."
                - paragraph [ref=e270]: Reach for it as soon as you have an idea worth taking seriously (a feature, a product direction, a business call, a piece of writing), and long before you have worked out what it involves. Vagueness is not a reason to wait; it is the thing the session eats. If you can already specify the thing precisely, you don't need to grill it.
                - paragraph [ref=e271]:
                  - text: Which of the three
                  - link "grilling" [ref=e272] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/grilling
                  - text: "skills you want depends on what is in front of you:"
                - list [ref=e273]:
                  - listitem [ref=e274]:
                    - strong [ref=e275]: Anything, anywhere
                    - text: ":"
                    - code [ref=e276]: grill-me
                    - text: . It needs no repo and writes no files, and the subject doesn't have to be code.
                  - listitem [ref=e277]:
                    - strong [ref=e278]: A codebase to align against
                    - text: ":"
                    - link "grill-with-docs" [ref=e279] [cursor=pointer]:
                      - /url: /skills-grill-with-docs
                    - text: . The same interview, but
                    - link "stateful" [ref=e280] [cursor=pointer]:
                      - /url: /ai-coding-dictionary/stateful
                    - text: ": it reads your code and keeps what it learns in"
                    - code [ref=e281]: CONTEXT.md
                    - text: and ADRs.
                  - listitem [ref=e282]:
                    - strong [ref=e283]: Too big for one session
                    - text: ":"
                    - link "wayfinder" [ref=e284] [cursor=pointer]:
                      - /url: /skills-wayfinder
                    - text: . It charts the effort as a map and runs grilling sessions inside it.
                - paragraph [ref=e285]:
                  - text: Leave
                  - link "plan mode" [ref=e286] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/agent-mode
                  - text: off.
                  - link "Plan mode" [ref=e287] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/agent-mode
                  - text: primes the agent to rush toward producing a plan, which is the opposite of staying in inquiry.
                - heading [level=2] [ref=e288]:
                  - link "It's a conversation, not an interview" [ref=e289] [cursor=pointer]:
                    - /url: "#its-a-conversation-not-an-interview"
                - paragraph [ref=e290]:
                  - text: The skill asks the questions, but
                  - strong [ref=e291]: you
                  - text: own the scope. That is the part people miss, and it separates a session that turns an idea into decisions from one that produces confident nonsense.
                - paragraph [ref=e292]:
                  - text: The failure mode is
                  - strong [ref=e293]: passivity
                  - text: ": answering \"agreed, agreed, agreed\" for forty questions and coming out with a plan the agent wrote and you nodded at. It feels productive because it was long. Nothing was actually decided, and the result carries a certainty it hasn't earned."
                - paragraph [ref=e294]: "Being active means steering. Push back on a question pitched beneath the fidelity you need. Say when the scope is drifting. Answer \"I don't know\" and mean it. This skill is built to aid an engineer, not to replace one: what comes out tracks the quality of your answers, not the number of questions asked."
                - paragraph [ref=e295]: "The opposite error is real but rarer: staying in the interview so long you never reach code."
                - heading [level=2] [ref=e296]:
                  - link "Grillable and ungrillable" [ref=e297] [cursor=pointer]:
                    - /url: "#grillable-and-ungrillable"
                - paragraph [ref=e298]: Some questions can be answered by talking. Others can't, and no amount of grilling will get you there.
                - paragraph [ref=e299]:
                  - text: "\"One long form or three pages?\" and \"how should this interaction feel?\" are"
                  - strong [ref=e300]: ungrillable
                  - text: ": they need something to react to. When you hit one, stop grilling. Build the throwaway version with"
                  - link "prototype" [ref=e301] [cursor=pointer]:
                    - /url: /skills-prototype
                  - text: ", look at it, then come back and answer in one line."
                - paragraph [ref=e302]: Talking your way through an ungrillable question is where sessions balloon. The agent keeps rephrasing, you keep guessing, and the scope grows to fill the uncertainty.
                - heading [level=2] [ref=e303]:
                  - link "It's working if" [ref=e304] [cursor=pointer]:
                    - /url: "#its-working-if"
                - list [ref=e305]:
                  - listitem [ref=e306]: You disagree with something. A session with no pushback from you is a session you didn't need.
                  - listitem [ref=e307]: Questions arrive in a few rounds rather than one long drip, and later rounds clearly build on what you said earlier.
                  - listitem [ref=e308]: You end up somewhere you didn't expect, because a question surfaced a decision you had been making implicitly.
                  - listitem [ref=e309]: At the end you could defend each choice to someone who wasn't there.
                - heading [level=2] [ref=e310]:
                  - link "Common questions" [ref=e311] [cursor=pointer]:
                    - /url: "#common-questions"
                - paragraph [ref=e312]:
                  - strong [ref=e313]: How many questions should I expect, and how do I know when it ends?
                  - text: "Count rounds, not questions. Forty-six questions across four rounds is an ordinary session. It ends when the frontier is empty: every branch visited, nothing left silently assumed."
                - paragraph [ref=e314]:
                  - strong [ref=e315]: It asked me two hundred questions. What went wrong?
                  - text: Usually the scope was too large. Ask the agent to break the work into smaller pieces first, then grill each one. Very long sessions also drift into the
                  - strong [ref=e316]:
                    - link "dumb zone" [ref=e317] [cursor=pointer]:
                      - /url: /ai-coding-dictionary/smart-zone
                  - text: ", where the"
                  - link "context window" [ref=e318] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/context-window
                  - text: is full enough that the questions get worse.
                - paragraph [ref=e319]:
                  - strong [ref=e320]: Can I go back to one question at a time?
                  - text: Yes. Add this to your global
                  - code [ref=e321]: CLAUDE.md
                  - text: ":"
                - generic [ref=e322]:
                  - button "Copy to clipboard" [ref=e323] [cursor=pointer]
                  - generic [ref=e324]: When grilling, ask one question at a time.
                - paragraph [ref=e328]:
                  - strong [ref=e329]: What if I genuinely don't know the answer?
                  - text: Say so. "I don't know" is a real answer, and a question you can't answer is usually a sign to prototype rather than to guess.
                - paragraph [ref=e330]:
                  - strong [ref=e331]: Do I start a fresh session before writing the spec?
                  - text: No. The value of the session is the
                  - link "context" [ref=e332] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/context
                  - text: you just built. Hand the same conversation straight to
                  - link "to-spec" [ref=e333] [cursor=pointer]:
                    - /url: /skills-to-spec
                  - text: .
                - paragraph [ref=e334]:
                  - strong [ref=e335]: Does the model matter?
                  - text: More than for most skills. Grilling leans on the
                  - link "model" [ref=e336] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/model
                  - text: "'s own sense of how systems break, so give it your best one. Implementation mostly follows context and tolerates a cheaper model."
                - heading [level=2] [ref=e337]:
                  - link "Where it fits" [ref=e338] [cursor=pointer]:
                    - /url: "#where-it-fits"
                - paragraph [ref=e339]:
                  - code [ref=e340]: grill-me
                  - text: is a
                  - strong [ref=e341]: standalone you can run anywhere, on anything
                  - text: . Being
                  - link "stateless" [ref=e342] [cursor=pointer]:
                    - /url: /ai-coding-dictionary/stateless
                  - text: "is what makes it portable: no repo, no workspace, no setup, and no assumption that the idea is even about software. People point it at business decisions, at writing, at what to do next: anything that won't sit still in their head."
                - paragraph [ref=e343]:
                  - text: That portability is the whole difference from
                  - link "grill-with-docs" [ref=e344] [cursor=pointer]:
                    - /url: /skills-grill-with-docs
                  - text: ", which runs the same interview but reads a codebase to align against and records what it learns as"
                  - code [ref=e345]: CONTEXT.md
                  - text: and ADRs. Both sit on the
                  - link "grilling" [ref=e346] [cursor=pointer]:
                    - /url: /skills-grilling
                  - text: primitive;
                  - code [ref=e347]: grill-me
                  - text: is the user-invoked front door that carries nothing with it.
                - paragraph [ref=e348]:
                  - text: If what you grilled does turn out to be software, you can hand the same conversation to
                  - link "to-spec" [ref=e349] [cursor=pointer]:
                    - /url: /skills-to-spec
                  - text: and carry on into the build flow (an option, not the point of the skill). When you're unsure which flow fits,
                  - link "ask-matt" [ref=e350] [cursor=pointer]:
                    - /url: /skills-ask-matt
                  - text: routes you.
                - complementary "Start the free AI Skills course" [ref=e351]:
                  - generic [ref=e352]:
                    - generic [ref=e353]: AI Hero · Free email course
                    - heading "Pressure-testing finds weak decisions. It does not ship the feature." [level=3] [ref=e354]
                    - paragraph [ref=e355]: "One command installs all 22 skills. Seven free lessons pick up where pressure-testing stops: settle the work, slice it, run it, check the diff. Go at your pace."
