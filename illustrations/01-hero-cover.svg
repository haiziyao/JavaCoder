  <circle cx="940" cy="342" r="9" fill="#FF6F61"/>
  <circle cx="1190" cy="452" r="8" fill="#2FB5A0"/>
  <circle cx="856" cy="342" r="8" fill="#FFB35C"/>
  <circle cx="1040" cy="352" r="7" fill="#FF8A3D"/>
  <circle cx="1215" cy="472" r="7" fill="#FF6F61"/>
  <circle cx="812" cy="352" r="6" fill="#2FB5A0"/>

