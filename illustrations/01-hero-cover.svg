    <path d="M -23 2 a 23 23 0 1 1 46 0 c 0 9 -5 14 -8 19 l -3 9 h -24 l -3 -9 c -3 -5 -8 -10 -8 -19 Z" fill="#FFC46B"/>
    <circle cx="0" cy="-8" r="9" fill="#FFE1A8"/>
    <rect x="-10" y="42" width="20" height="8" rx="4" fill="#FFB35C"/>
    <rect x="-14" y="52" width="28" height="8" rx="4" fill="#FFB35C"/>
