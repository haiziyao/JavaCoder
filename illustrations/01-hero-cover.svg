<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#E9A35B" flood-opacity="0.30"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#E9A35B" flood-opacity="0.22"/>
    </filter>
    <filter id="ink" x="-40%" y="-40%" width="200%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6E4F33" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="#FFF7E8"/>
