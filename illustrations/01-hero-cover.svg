    <path transform="translate(760,90) scale(0.7)" d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z"/>
    <path transform="translate(1130,120) scale(0.55)" d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z"/>
  </g>
  <g fill="#FFFFFF">
    <path transform="translate(1420,300) scale(0.8)" d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z"/>
    <path transform="translate(260,340) scale(0.6)" d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z"/>
