    <circle cx="1350" cy="150" r="52" fill="#FF8778"/>
    <circle cx="1332" cy="128" r="16" fill="#FFB3A6"/>
  </g>
  <ellipse cx="1350" cy="150" rx="132" ry="42" fill="none" stroke="#BFE6DF" stroke-width="5"
           transform="rotate(-16 1350 150)" stroke-dasharray="10 16" opacity="0.9"/>

  <!-- 云朵 -->
