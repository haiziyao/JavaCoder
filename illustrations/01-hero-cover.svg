  <circle cx="1500" cy="90" r="180" fill="#E2F6F1" opacity="0.9"/>
  <circle cx="860" cy="8" r="130" fill="#FFE7C4" opacity="0.6"/>
  <circle cx="420" cy="885" r="150" fill="#E2F6F1" opacity="0.8"/>
  <circle cx="1450" cy="820" r="130" fill="#FFEFD0" opacity="0.7"/>

