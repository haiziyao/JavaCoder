<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyCoder</title>
  <style>
    :root{--bg:#0b0d10;--side:#0f1216;--card:#15191e;--hover:#1b2027;--line:#252b33;--text:#e8edf3;--muted:#89939f;--green:#70e1b0;--blue:#77a7ff;--danger:#ff7e83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:260px 1fr;height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:7px 9px 21px;font-weight:750;letter-spacing:-.02em}.logo{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#78e5bc,#6c9cff);color:#07120e;font:900 13px monospace;box-shadow:0 0 24px #70e1b025}.new{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:11px 12px;text-align:left;cursor:pointer;transition:.2s}.new:hover{background:var(--hover);border-color:#39424d}.new span{float:right;color:var(--muted)}.label{font-size:11px;color:#626d78;text-transform:uppercase;letter-spacing:.11em;margin:26px 10px 10px}.history{font-size:13px;color:#a6afb9;padding:10px;border-radius:7px;background:#14181d}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:16px 9px 2px}.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.online{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.version{font:10px monospace;color:#555f69;margin-top:8px}.main{min-width:0;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--muted);font-size:12px}.model{border:1px solid var(--line);padding:6px 9px;border-radius:6px;color:#aeb7c1}.chat{flex:1;overflow-y:auto;padding:0 20px;scroll-behavior:smooth}.thread{width:min(800px,100%);margin:auto;padding:42px 0 190px}.welcome{text-align:center;padding:11vh 10px 30px}.welcome .hero-logo{margin:auto;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:#15241f;border:1px solid #315a49;color:var(--green);font:800 19px monospace}.welcome h1{font-size:28px;margin:19px 0 8px;letter-spacing:-.04em}.welcome p{color:var(--muted);font-size:14px;margin:0}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:30px auto 0;max-width:600px}.suggestion{border:1px solid var(--line);background:var(--card);border-radius:10px;color:#b8c1cb;padding:13px;text-align:left;cursor:pointer;font-size:12px}.suggestion:hover{border-color:#3c4854;background:var(--hover)}.message{display:grid;grid-template-columns:32px 1fr;gap:13px;margin:25px 0}.avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 11px monospace;background:#20262d;color:#bac4cf}.message.assistant .avatar{background:#14251f;color:var(--green);border:1px solid #294c3e}.who{font-size:12px;font-weight:700;margin:2px 0 7px}.content{white-space:pre-wrap;line-height:1.72;font-size:14px;color:#d8dee5;overflow-wrap:anywhere}.tool{margin:10px 0;border:1px solid var(--line);background:#111419;border-radius:8px;overflow:hidden;font:12px ui-monospace,monospace}.tool-head{padding:9px 11px;display:flex;gap:8px;align-items:center;color:#a9b3bd}.tool-head b{color:var(--blue)}.tool-output{display:none;border-top:1px solid var(--line);padding:10px;color:#7f8994;white-space:pre-wrap;max-height:180px;overflow:auto}.tool.done .tool-output{display:block}.tool.error{border-color:#5b3034}.composer-wrap{position:absolute;bottom:0;left:260px;right:0;padding:35px 20px 18px;background:linear-gradient(transparent,var(--bg) 30%)}.composer{width:min(800px,100%);margin:auto;background:#15191e;border:1px solid #303740;border-radius:13px;box-shadow:0 14px 45px #0008;transition:.2s}.composer:focus-within{border-color:#52606e;box-shadow:0 14px 50px #0009,0 0 0 1px #52606e44}textarea{display:block;width:100%;height:66px;max-height:160px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:17px 17px 8px;font:14px inherit}textarea::placeholder{color:#69737e}.compose-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 9px 9px 14px;color:#626d78;font-size:10px}.send{width:32px;height:32px;border:0;border-radius:8px;background:var(--green);color:#082017;cursor:pointer;font-size:17px}.send:disabled{background:#30363d;color:#66717c;cursor:not-allowed}.mobile-brand{display:none}.typing:after{content:'▋';color:var(--green);animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-brand{display:block}.composer-wrap{left:0}.top{padding:0 15px}.thread{padding-top:20px}.suggestions{grid-template-columns:1fr}.welcome{padding-top:7vh}}
  </style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">&gt;_</div>MyCoder</div><button class="new" id="new">＋ 新建对话 <span>⌘ K</span></button><div class="label">当前会话</div><div class="history">未命名的编程任务</div><div class="side-foot"><div class="status"><i class="online"></i>Agent 已就绪</div><div class="version">JAVA 21 · LOCAL UI</div></div></aside><main class="main"><header class="top"><span class="mobile-brand">MyCoder</span><span>AI Coding Workspace</span><span class="model">● OpenAI Compatible</span></header><div class="chat" id="chat"><div class="thread" id="thread"><section class="welcome" id="welcome"><div class="hero-logo">&gt;_</div><h1>今天想构建什么？</h1><p>描述任务，MyCoder 会读取代码、调用工具并完成它。</p><div class="suggestions"><button class="suggestion">分析这个项目的结构和技术栈</button><button class="suggestion">运行测试并修复发现的问题</button><button class="suggestion">帮我找到可以优化的代码</button><button class="suggestion">为当前项目补充使用文档</button></div></section></div></div><div class="composer-wrap"><div class="composer"><textarea id="input" placeholder="向 MyCoder 描述一个任务…"></textarea><div class="compose-foot"><span>Enter 发送 · Shift + Enter 换行</span><button class="send" id="send" title="发送">↑</button></div></div></div></main></div>
<script>
const input=document.querySelector('#input'),send=document.querySelector('#send'),thread=document.querySelector('#thread'),chat=document.querySelector('#chat');let busy=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function scroll(){chat.scrollTop=chat.scrollHeight}function msg(role,text=''){document.querySelector('#welcome')?.remove();let el=document.createElement('div');el.className='message '+role;el.innerHTML=`<div class="avatar">${role==='user'?'YOU':'AI'}</div><div><div class="who">${role==='user'?'你':'MyCoder'}</div><div class="content"></div></div>`;el.querySelector('.content').textContent=text;thread.append(el);scroll();return el.querySelector('.content')}
async function submit(text=input.value.trim()){if(!text||busy)return;busy=true;send.disabled=true;input.value='';input.style.height='66px';msg('user',text);let content=msg('assistant');content.classList.add('typing');try{let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});if(!res.ok)throw Error('HTTP '+res.status);let reader=res.body.getReader(),decoder=new TextDecoder(),buf='';while(true){let {done,value}=await reader.read();buf+=decoder.decode(value||new Uint8Array(),{stream:!done});let lines=buf.split('\n');buf=lines.pop();for(let line of lines)if(line.trim())event(JSON.parse(line),content);if(done){if(buf.trim())event(JSON.parse(buf),content);break}}}catch(e){content.textContent+='\n请求失败：'+e.message}finally{content.classList.remove('typing');busy=false;send.disabled=false;input.focus();scroll()}}
function event(e,content){if(e.type==='delta')content.textContent+=e.text;if(e.type==='status'&&!content.textContent)content.dataset.status=e.text;if(e.type==='tool_start'){let t=document.createElement('div');t.className='tool';t.dataset.name=e.name;t.innerHTML=`<div class="tool-head">⌁ 正在执行 <b>${esc(e.name)}</b></div><div class="tool-output"></div>`;content.parentElement.append(t)}if(e.type==='tool_end'){let tools=content.parentElement.querySelectorAll(`.tool[data-name="${CSS.escape(e.name)}"]`),t=tools[tools.length-1];if(t){t.classList.add('done');if(e.error)t.classList.add('error');t.querySelector('.tool-head').innerHTML=`${e.error?'×':'✓'} <b>${esc(e.name)}</b> ${e.error?'执行失败':'执行完成'}`;t.querySelector('.tool-output').textContent=e.output||'（无输出）'}}if(e.type==='error')content.textContent+='\n错误：'+e.message;scroll()}
send.onclick=()=>submit();input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'};document.querySelectorAll('.suggestion').forEach(x=>x.onclick=()=>submit(x.textContent));document.querySelector('#new').onclick=async()=>{if(busy)return;await fetch('/api/clear',{method:'POST'});location.reload()};
</script></body></html>
