<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyCoder · Agent 工作台</title>
<style>
  /* ========= 设计系统：明亮卡通插画 =========
     橙色 / 珊瑚橙 / 奶油白 / 青绿 / 柔和浅蓝
     圆润形状 · 轻微 3D 纸雕感 · 扁平矢量
     ======================================== */
  :root {
    --cream:      #FFF9F0;
    --cream-2:    #FFEFDD;
    --paper:      #FFFFFF;
    --orange:     #FF8A3D;
    --coral:      #FF7A6B;
    --coral-deep: #F05B4E;
    --teal:       #2EC4B6;
    --teal-deep:  #1FA99B;
    --blue-soft:  #BDE3F4;
    --ink:        #4A3728;
    --ink-soft:   #8F786A;
    --line:       rgba(74,55,40,.10);
    --shadow-card: 0 12px 30px rgba(255,138,61,.14);
    --shadow-soft: 0 18px 40px rgba(255,138,61,.16);
    --radius: 20px;
    --font: "PingFang SC","Microsoft YaHei","Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono: ui-monospace,SFMono-Regular,Consolas,"Cascadia Code",monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; font-family:var(--font); color:var(--ink);
    background:
      radial-gradient(circle at 88% -8%, rgba(46,196,182,.16), transparent 46%),
      radial-gradient(circle at -6% 108%, rgba(255,138,61,.14), transparent 45%),
      var(--cream);
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  button { font-family:inherit; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,138,61,.35); border-radius:99px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ---- 顶部品牌栏 ---- */
  header {
    height:66px; display:flex; align-items:center; gap:13px; padding:0 22px;
    background:rgba(255,255,255,.72); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); z-index:5; flex:0 0 auto;
  }
  .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .brand-mark {
    width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--orange),var(--coral)); color:#fff;
    font:800 12px var(--mono); box-shadow:0 9px 18px rgba(255,122,107,.38);
  }
  .brand small { color:var(--ink-soft); font-weight:600; font-size:12px; margin-left:2px; }

  .status {
    margin-left:auto; display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:7px 15px; font-size:12.5px; font-weight:700; color:var(--ink-soft);
    box-shadow:0 6px 14px rgba(74,55,40,.06);
  }
  .status .dot { width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(46,196,182,.18); }
  .status.busy .dot { background:var(--coral); box-shadow:0 0 0 4px rgba(255,122,107,.2); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform:scale(.7); opacity:.6; } }
  .spacer { width:16px; }

  /* ---- 主布局：左会话语 / 中对话 / 右动态 ---- */
  main { flex:1; display:grid; grid-template-columns:230px minmax(0,1fr) 380px; gap:16px; padding:16px 22px 12px; min-height:0; }
  .panel {
    background:rgba(255,255,255,.78); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-card); overflow:hidden; display:flex; flex-direction:column; min-height:0;
    position:relative;
  }
  /* “回到底部”悬浮按钮：仅在用户上翻历史时浮现 */
  .jump-down {
    display:none; position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    z-index:6; border:1px solid rgba(255,138,61,.35); background:rgba(255,255,255,.94);
    color:var(--coral-deep); font:800 12px var(--font); padding:8px 15px; border-radius:999px;
    box-shadow:0 8px 20px rgba(74,55,40,.16); cursor:pointer; backdrop-filter:blur(4px);
    animation:pop .25s ease; transition:.18s;
  }
  .jump-down:hover { transform:translateX(-50%) translateY(-2px); box-shadow:0 10px 24px rgba(255,138,61,.28); }
  .jump-down.show { display:block; }

  /* ---- 对话区 ---- */
  .chat-head {
    padding:13px 18px; display:flex; align-items:center; gap:9px; font-weight:800; font-size:13.5px;
    border-bottom:1px dashed rgba(74,55,40,.14); flex:0 0 auto; color:var(--ink);
  }
  .chat-head .feed { margin-left:auto; color:var(--ink-soft); font:600 11.5px var(--mono); letter-spacing:.03em; }
  .chat-head .head-act {
    margin-left:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    font:700 11px var(--font); padding:5px 11px; border-radius:999px; cursor:pointer; transition:.18s;
  }
  .chat-head .head-act:hover { color:var(--coral-deep); border-color:rgba(255,122,107,.4); background:#FFF7F4; transform:translateY(-1px); }
  .chat-head .head-act:active { transform:none; }
  #msgs { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:18px; }

  .msg { display:flex; flex-direction:column; max-width:92%; }
  .msg .who { font-size:11.5px; font-weight:800; color:var(--ink-soft); margin-bottom:7px; letter-spacing:.04em; display:flex; align-items:center; gap:7px; }
  .msg .balloon {
    padding:13px 17px; border-radius:18px; line-height:1.75; font-size:14.2px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.user    { align-self:flex-end; align-items:flex-end; }
  .msg.agent   { align-self:flex-start; align-items:flex-start; }
  .msg.user .who  { color:var(--coral-deep); }
  .msg.user .balloon {
    background:linear-gradient(135deg,var(--orange),var(--coral)); color:#fff;
    border-bottom-right-radius:6px; box-shadow:0 10px 22px rgba(255,122,107,.32);
  }
  .msg.agent .balloon {
    background:var(--paper); border:1px solid var(--line);
    border-bottom-left-radius:6px; box-shadow:0 8px 18px rgba(74,55,40,.06);
  }
  .msg.agent .who  { color:var(--teal-deep); }
  .msg .copy-btn {
    position:relative; margin-top:7px; align-self:flex-start; border:1px solid var(--line);
    background:var(--paper); color:var(--ink-soft); font:700 11px var(--font);
    padding:3px 10px; border-radius:999px; cursor:pointer; opacity:.7; transition:.18s;
  }
  .msg .copy-btn:hover { opacity:1; color:var(--teal-deep); border-color:rgba(46,196,182,.45); background:#F0FCF9; }
  .msg.user .copy-btn { align-self:flex-end; }
  .msg.user .copy-btn:hover { color:var(--coral-deep); border-color:rgba(255,122,107,.4); background:#FFF5F2; }

  /* 每轮（Turn）独立气泡：带轮次徽章与完成状态 */
  .msg.agent .turn-badge {
    display:inline-flex; align-items:center; gap:5px;
    background:linear-gradient(135deg,rgba(46,196,182,.16),rgba(189,227,244,.4));
    color:var(--teal-deep); font:800 10.5px var(--mono); letter-spacing:.02em;
    border-radius:999px; padding:2px 10px; border:1px solid rgba(46,196,182,.25);
  }
  .msg.agent .turn-badge .dot {
    width:7px;height:7px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 0 3px rgba(46,196,182,.2); animation:pulse 1.1s infinite;
  }
  .msg.agent .turn-badge .dot.stop { animation:none; background:var(--teal-deep); box-shadow:none; }
  .msg.agent.done .balloon { border-color:rgba(46,196,182,.4); }
  .msg.agent .who-flow { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .msg.agent .who-flow .who { margin-bottom:0; }

  .empty { align-self:center; margin:auto; text-align:center; color:var(--ink-soft); }
  .empty .big { font-size:44px; margin-bottom:10px; filter:drop-shadow(0 6px 10px rgba(255,138,61,.25)); }
  .empty h3 { margin:0 0 6px; font-size:18px; color:var(--ink); }
  .empty p { margin:0; font-size:13px; }

  /* ---- 输入区 ---- */
  .input-bar { flex:0 0 auto; padding:14px 18px 18px; border-top:1px dashed rgba(74,55,40,.14); }
  .input-shell {
    display:flex; align-items:flex-end; gap:10px; background:var(--paper);
    border:1.5px solid rgba(255,138,61,.28); border-radius:18px; padding:10px 12px;
    box-shadow:0 10px 22px rgba(255,138,61,.10); transition:.2s;
  }
  .input-shell:focus-within { border-color:var(--orange); box-shadow:0 12px 26px rgba(255,138,61,.2); }
  #input {
    flex:1; border:none; outline:none; resize:none; font-family:inherit; font-size:14px; line-height:1.5;
    max-height:130px; background:transparent; color:var(--ink); padding:4px 2px;
  }
  .send {
    flex:0 0 auto; border:none; cursor:pointer; height:42px; padding:0 20px; border-radius:14px;
    background:linear-gradient(135deg,var(--orange),var(--coral)); color:#fff; font-weight:800; font-size:14px;
    box-shadow:0 9px 18px rgba(255,122,107,.35); transition:.18s; display:flex; align-items:center; gap:6px;
  }
  .send:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(255,122,107,.45); }
  .send:active { transform:translateY(0); }
  .send:disabled { opacity:.55; cursor:not-allowed; transform:none; }
  .send.empty { opacity:.4; cursor:not-allowed; box-shadow:none; transform:none; }
  .hint { margin-top:9px; text-align:center; color:var(--ink-soft); font-size:11.5px; }

  /* ---- 右侧：实时动态 ---- */
  .log-head {
    padding:13px 18px; display:flex; align-items:center; gap:9px; font-weight:800; font-size:13.5px;
    border-bottom:1px dashed rgba(74,55,40,.14); flex:0 0 auto;
  }
  .log-head .count { margin-left:auto; cursor:pointer; color:var(--ink-soft); font:600 11px var(--mono); }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:linear-gradient(180deg,rgba(255,239,221,.35),rgba(255,255,255,0)); }

  .entry { animation:pop .25s ease; }
  @keyframes pop { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }
  .entry.flash { animation:cardflash .55s ease; }
  @keyframes cardflash {
    0%{ box-shadow:0 0 0 4px rgba(46,196,182,.55); }
    100%{ box-shadow:none; }
  }

  /* ---- 工具生命周期卡片：tool_use 与 tool_result 通过 id 合并成一张 ---- */
  .t-card {
    display:flex; flex-direction:column; gap:7px; border:1px solid rgba(255,138,61,.24);
    background:linear-gradient(135deg,#fff, #FFF4E6); border-radius:16px; padding:11px 14px;
    box-shadow:0 8px 16px rgba(255,138,61,.13);
  }
  .t-card.ready { border-color:rgba(46,196,182,.45); background:linear-gradient(135deg,#fff,#E8FBF6); box-shadow:0 8px 16px rgba(46,196,182,.15); }
  .t-card.fail  { border-color:rgba(255,122,107,.5);  background:linear-gradient(135deg,#fff,#FFF1EF); box-shadow:0 8px 16px rgba(255,122,107,.16); }
  .t-card .t-head { display:flex; align-items:center; gap:9px; }
  .t-card .t-ico {
    width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(135deg,var(--orange),var(--coral)); color:#fff; font:800 12px var(--mono);
  }
  .t-card.ready .t-ico { background:linear-gradient(135deg,var(--teal),var(--teal-deep)); }
  .t-card.fail  .t-ico  { background:linear-gradient(135deg,var(--coral),var(--coral-deep)); }
  .t-card .t-name { font-weight:800; font-size:12.5px; word-break:break-all; }
  .t-card .t-state { margin-left:auto; display:inline-flex; align-items:center; gap:6px; font:700 10.5px var(--mono); color:var(--ink-soft); }
  .t-card .t-state .spin {
    width:13px;height:13px;border-radius:50%;border:2.5px solid rgba(46,196,182,.25);border-top-color:var(--teal);
    animation:rot 1s linear infinite; flex:0 0 auto;
  }
  @keyframes rot { to{transform:rotate(360deg);} }
  .t-card.ready .t-state { color:var(--teal-deep); }
  .t-card.fail  .t-state  { color:var(--coral-deep); }
  .t-card .t-args {
    font:11px/1.6 var(--mono); color:var(--ink-soft); word-break:break-all;
    background:rgba(74,55,40,.04); border-radius:10px; padding:7px 10px; white-space:pre-wrap;
  }
  .t-card .t-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; opacity:0; max-height:0; overflow:hidden; transition:.3s; }
  .t-card.ready .t-foot, .t-card.fail .t-foot { opacity:1; max-height:80px; }
  .t-card .t-tick {
    flex:0 0 auto; width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--teal),var(--teal-deep)); color:#fff; font-size:11px; font-weight:900;
    box-shadow:0 4px 8px rgba(46,196,182,.35);
  }
  .t-card.fail .t-tick { background:linear-gradient(135deg,var(--coral),var(--coral-deep)); }
  .t-card .t-out { font:11px var(--mono); color:var(--ink-soft); }
  .t-card .t-hint { font:10.5px/1.5 var(--mono); color:#A0846F; background:rgba(74,55,40,.05);
    border-radius:8px; padding:4px 8px; flex:1 1 auto; min-width:0; word-break:break-all; }

  /* 其它类型日志：刻意保持不同的视觉语言 */
  .p-turn { align-self:flex-start; display:inline-flex; align-items:center; gap:7px;
    color:var(--teal-deep); font:800 11px var(--mono); letter-spacing:.04em;
    background:rgba(189,227,244,.35); border-radius:999px; padding:5px 12px; }
  .p-turn::before { content:""; width:8px;height:8px;border-radius:50%;background:var(--teal); box-shadow:0 0 0 4px rgba(46,196,182,.18); }

  .p-log { font:11px/1.6 var(--mono); color:#A0846F; background:rgba(74,55,40,.05);
    border-radius:11px; padding:8px 11px; border-left:3px solid #D8B98F; }

  .p-wait {
    display:flex; align-items:center; gap:10px; border:1.5px dashed rgba(189,227,244,.95);
    background:linear-gradient(135deg,#fff,#EDF8fd); border-radius:13px; padding:9px 12px;
    font-size:12px; color:var(--ink);
  }
  .p-wait .dot3 { display:flex; gap:3px; }
  .p-wait .dot3 i { width:6px;height:6px;border-radius:50%;background:var(--teal); animation:bounce 1.2s infinite; }
  .p-wait .dot3 i:nth-child(2){ animation-delay:.15s; }
  .p-wait .dot3 i:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce { 0%,100%{transform:translateY(0);opacity:.5;} 50%{transform:translateY(-3px);opacity:1;} }

  .p-note {
    font:11.5px/1.6 "PingFang SC",var(--font); color:var(--ink-soft);
    background:linear-gradient(135deg,#fff,#F6FAFF); border:1px solid rgba(189,227,244,.9);
    border-radius:12px; padding:8px 12px; box-shadow:0 4px 10px rgba(74,55,40,.04);
  }

  .p-error {
    display:flex; align-items:flex-start; gap:9px; border:1px solid rgba(255,122,107,.4);
    background:linear-gradient(135deg,#FFF4F2,#FFF); border-radius:14px; padding:10px 12px;
    font-size:12.5px; color:var(--coral-deep); box-shadow:0 6px 14px rgba(255,122,107,.12);
  }
  .p-error .err-ico { font-weight:900; font-size:15px; line-height:1; }

  .log-empty { color:var(--ink-soft); font-size:12.5px; text-align:center; padding:22px 6px; line-height:1.8; }
  .log-empty b { color:var(--orange); }

  /* ---- 会话侧栏 ---- */
  .sess-panel { min-width:0; }
  .sess-head {
    padding:13px 14px; display:flex; align-items:center; gap:9px; font-weight:800; font-size:13.5px;
    border-bottom:1px dashed rgba(74,55,40,.14); flex:0 0 auto;
  }
  .sess-new {
    margin-left:auto; width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
    border:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;
    font-size:17px;font-weight:900;box-shadow:0 5px 12px rgba(46,196,182,.3);transition:.18s;
  }
  .sess-new:hover { transform:translateY(-2px) rotate(90deg); }
  .sess-tools { margin-left:auto; display:flex; gap:6px; }
  .sess-tools button {
    width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;font-size:12.5px;transition:.15s;
  }
  .sess-tools button:hover { color:var(--teal-deep); border-color:rgba(46,196,182,.45); background:#F0FCF9; }
  .sess-list { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .sess-item {
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:12px;
    border:1px solid transparent; cursor:pointer; transition:.15s; background:transparent;
    font:600 12.5px var(--font); color:var(--ink); text-align:left;
  }
  .sess-item:hover { background:rgba(255,138,61,.07); }
  .sess-item.active {
    background:linear-gradient(135deg,rgba(255,138,61,.14),rgba(255,122,107,.10));
    border-color:rgba(255,138,61,.35);
  }
  .sess-item .s-title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess-item .s-del {
    flex:0 0 auto; width:20px;height:20px;border-radius:7px;display:grid;place-items:center;
    border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;opacity:0;transition:.15s;
  }
  .sess-item:hover .s-del { opacity:1; }
  .sess-item .s-del:hover { background:rgba(255,122,107,.18); color:var(--coral-deep); }
  .sess-empty { color:var(--ink-soft); font-size:12px; text-align:center; padding:18px 6px; line-height:1.7; }

  @media (max-width:1200px){ main{ grid-template-columns:200px minmax(0,1fr) 320px; } }
  @media (max-width:900px){ main{ grid-template-columns:1fr; } .hide-sm{display:none;} .sess-panel{ display:none; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark">&gt;_</span> MyCoder<small>· Agent 工作台</small></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">就绪</span></div>
</header>

<main>
  <!-- 左：会话列表（纯前端 localStorage 持久化） -->
  <section class="panel sess-panel">
    <div class="sess-head">📂 会话
      <div class="sess-tools">
        <button id="exportSess" title="导出全部会话为 JSON 备份">⤓</button>
        <button id="importSess" title="从 JSON 备份导入会话">⤒</button>
      </div>
      <button class="sess-new" id="newSession" title="新建会话">＋</button>
    </div>
    <div class="sess-list" id="sessList"></div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  </section>

  <!-- 中：对话 -->
  <section class="panel">
    <div class="chat-head">💬 对话
      <span class="feed hide-sm" id="feed">turn · streaming</span>
      <button class="head-act" id="clearMsgs" title="清空当前对话与动态">🧹 清空</button>
    </div>
    <div id="msgs"></div>
    <button class="jump-down" id="jumpDown" title="回到最新回复">↓ 最新</button>
    <div class="input-bar">
      <div class="input-shell">
        <textarea id="input" rows="1" placeholder="描述你想让 Agent 完成的任务…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="sendBtn"><span>发送</span> ↑</button>
      </div>
      <div class="hint">Agent 可在项目环境中读取 · 搜索 · 编辑 · 运行，直至完成任务</div>
    </div>
  </section>

  <!-- 右：实时动态（工具卡片按 id 归并，不依赖时间排序） -->
  <section class="panel">
    <div class="log-head">🛠 实时动态 <span class="count" id="clearLog">清空</span></div>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const msgsEl = $('#msgs'), logEl = $('#log'), input = $('#input'), sendBtn = $('#sendBtn');
let busy = false;
let currentES = null;        // 当前会话 SSE
let assistantBalloon = null; // 正在流式输出的气泡元素
let esRetryCount = 0;        // SSE 连续重连计数，用于退避

/* ---------- 纯前端会话管理（localStorage 持久化） ----------
   不依赖后端：所有会话的“用户消息 + AI 回复”都保存在浏览器本地，
   可新建 / 切换 / 删除 / 重命名，刷新后自动恢复，并支持导出备份。 */
const SESS_KEY   = 'mycoder.sessions.v1';   // 全部会话
const ACTIVE_KEY = 'mycoder.activeSession'; // 当前选中会话 id
let sessions = [];          // [{id,title,createdAt,messages:[...]}]
let activeId = null;
let curText = '';           // 当前轮正在流式累积的文本
let activeAssistant = null; // {turns:[]} 正在累积的 assistant 聚合回复

/* ---- 读取 / 写入 ----
   localStorage 有大小限制（约 5MB），写入失败（如文本过长）时降级：
   不中断会话，仅静默丢弃本次持久化，并在控制台提示。 */
function loadSessions(){
  try{
    const raw = localStorage.getItem(SESS_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  }catch(e){ sessions = []; }
  if(!Array.isArray(sessions)) sessions = [];
  activeId = localStorage.getItem(ACTIVE_KEY) || null;
  if(activeId && !sessions.some(s=>s.id===activeId)) activeId = null;
  if(!activeId && sessions.length) activeId = sessions[0].id;
}
function persistSessions(){
  try{
    localStorage.setItem(SESS_KEY, JSON.stringify(sessions));
    if(activeId) localStorage.setItem(ACTIVE_KEY, activeId);
  }catch(e){
    // 空间不足等：只丢弃保存，不打断使用
    console.warn('[会话] 本地保存失败（可能存储空间不足）:', e.message);
  }
}
function activeSession(){ return sessions.find(s=>s.id===activeId) || null; }
function newId(){ return 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

/* ---- 会话增删切换 ---- */
function createSession(){
  const n = sessions.length + 1;
  let title = '会话 ' + n;
  while(sessions.some(s=>s.title===title)) title = '会话 ' + (++n);
  const s = { id:newId(), title, createdAt:Date.now(), messages:[] };
  sessions.unshift(s);           // 新会话放最前
  persistSessions();
  switchSession(s.id);
}
function deleteSession(id){
  if(sessions.length <= 1){ resetConversation(); return; }   // 至少保留一个
  const idx = sessions.findIndex(s=>s.id===id);
  if(idx < 0) return;
  sessions.splice(idx,1);
  if(activeId === id) activeId = sessions[0].id;
  persistSessions();
  renderSessList();
  renderActiveConversation();
}
function switchSession(id){
  if(id === activeId) return;
  if(busy) stopAndFreeze();      // 正在运行：先收口当前会话再切换
  activeId = id;
  persistSessions();
  renderSessList();
  renderActiveConversation();
}

/* ---- 会话列表 DOM ---- */
function renderSessList(){
  const list = $('#sessList');
  list.innerHTML = '';
  if(!sessions.length){
    list.appendChild(el('div','sess-empty','还没有会话\n点击右上角 ＋ 新建'));
    return;
  }
  sessions.forEach(s=>{
    const item = el('button','sess-item'+(s.id===activeId?' active':''));
    item.title = s.title;
    const t = el('span','s-title', s.title);
    const del = el('button','s-del','✕');
    del.title='删除会话';
    del.addEventListener('click', e=>{ e.stopPropagation(); deleteSession(s.id); });
    item.appendChild(t); item.appendChild(del);
    item.addEventListener('click', ()=> switchSession(s.id));
    item.addEventListener('dblclick', e=>{
      e.stopPropagation();
      const name = prompt('重命名会话：', s.title);
      if(name && name.trim()){
        s.title = name.trim();
        persistSessions(); renderSessList();
      }
    });
    list.appendChild(item);
  });
}

/* ---- 会话消息渲染 ---- */
function renderActiveConversation(){
  // 停止任何残留实时状态
  endStream();
  sealTurn();
  // 清空当前消息区与动态
  msgsEl.innerHTML = '';
  logEl.innerHTML = '';
  toolCards.clear();
  turnSeq = 0; assistantBalloon = null; currentTurnEl = null;
  currentElFeed('idle');

  const s = activeSession();
  if(!s || !s.messages || !s.messages.length){ showEmpty(); renderSessList(); return; }

  let conv = 0, turn = 0;
  const frag = document.createDocumentFragment();
  for(const it of s.messages){
    if(it.role === 'user'){
      conv++; turn = 0;
      const m = el('div','msg user');
      m.appendChild(el('div','who','● YOU'));
      m.appendChild(el('div','balloon', it.content));
      frag.appendChild(m);
    }
    else if(it.role === 'assistant' && (it.turns||[]).length){
      it.turns.forEach(tc=>{
        turn++;
        const m = el('div','msg agent done');
        const flow = el('div','who-flow');
        flow.appendChild(el('div','who','● AGENT'));
        const badge = el('span','turn-badge');
        badge.appendChild(el('span','dot stop'));
        badge.appendChild(el('span',null, '话 #'+conv+' · 第 '+turn+' 轮 · 完成'));
        flow.appendChild(badge);
        m.appendChild(flow);
        const b = el('div','balloon', tc||'');   // turns 元素是纯文本字符串
        m.appendChild(b);
        attachCopyBtn(m, b);
        frag.appendChild(m);
      });
    }
  }
  msgsEl.appendChild(frag);
  renderSessList();
  if(!busy) scrollToBottom();
}
function currentElFeed(t){ document.getElementById('feed').textContent = t; }

/* 切换到会话前，把当前正在流式输出的内容收口进本地会话（避免数据丢失） */
function stopAndFreeze(){
  endStream();
  sealTurn();
  if(activeAssistant){
    if(curText) activeAssistant.turns.push(curText.trim()||'');   // 最后未封口的一轮
    const s = activeSession();
    if(s && activeAssistant.turns.length){
      s.messages.push({ role:'assistant', turns: activeAssistant.turns.filter(t=>t) });
    }
    activeAssistant = null; curText = '';
  }
  persistSessions();
  finishTurn();
}

/* ---------- 工具卡片配对表 ----------
   Agent 里 tool_use 在流式阶段（上一轮）就推送，tool_result 在
   下一轮才推送。若简单按时间追加，二者会因中间穿插的日志而割裂。
   这里改用 toolId 作为主键：tool_result 到达时精准回填到对应卡片。 */
const toolCards = new Map();   // id -> { card, argsEl, stateEl, lastTool }

/* ---------- 工具卡片内存保护 ----------
   长时间运行时 toolCards Map 会无限增长；超过上限时，
   把最旧的已完成卡片从 DOM 和 Map 中移除，只保留仍在执行中的。 */
const TOOL_CARD_MAX = 200;
function capToolCards(){
  if(toolCards.size <= TOOL_CARD_MAX) return;
  const removable = [];
  for(const [id, rec] of toolCards){
    if(!rec.card.classList.contains('ready') && !rec.card.classList.contains('fail')){
      continue; // 正在执行中的卡片不清理
    }
    removable.push([id, rec]);
    if(toolCards.size - removable.length <= TOOL_CARD_MAX) break;
  }
  for(const [id, rec] of removable){
    rec.card.remove();
    toolCards.delete(id);
  }
}

/* ---------- DOM 帮助 ---------- */
function el(tag, cls, text){ const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n; }

/* 给已完成的 Agent 气泡加一个「复制」角标，方便拷贝代码/长文本 */
function attachCopyBtn(balloonWrap, balloon){
  if(!balloonWrap || !balloon || !balloon.textContent.trim()) return;
  if(balloonWrap.querySelector('.copy-btn')) return;   // 已有则跳过
  const cb = el('button','copy-btn','⧉ 复制');
  cb.title='复制这条回复';
  cb.addEventListener('click', ()=>{
    const text = balloon.textContent;
    const done = ()=>{ cb.textContent='✓ 已复制'; setTimeout(()=>{ cb.textContent='⧉ 复制'; }, 1200); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(/*fallback*/()=> legacyCopy(text, done));
    } else { legacyCopy(text, done); }
  });
  balloonWrap.appendChild(cb);
}
function legacyCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}

function setStatus(busy){
  document.getElementById('status').classList.toggle('busy', busy);
  document.getElementById('statusText').textContent = busy ? 'Agent 工作中…' : '就绪';
}

function resizeInput(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,130)+'px'; }
input.addEventListener('input', resizeInput);
input.addEventListener('paste', resizeInput);   // 粘贴后立即按新内容重新计算高度，避免出现滚动条/按钮失效
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });/* ---------- 回合生命周期 ----------
   一次对话会由 Agent 执行 n 轮（每轮流式输出一段），
   这里为每一轮开独立的气泡并标注「第 N 轮」，turn_complete 时封口。 */
let turnSeq = 0;       // 当前对话中，Agent 正在执行到的轮次编号（从1开始）
let currentTurnEl = null;

function openTurnBubble(turn, running){
  const m = el('div','msg agent');
  const flow = el('div','who-flow');
  const who = el('div','who','● AGENT');
  const badge = el('span','turn-badge');
  badge.appendChild(el('span','dot'+(running?'':' stop')));
  badge.appendChild(el('span',null, '第 '+turn+' 轮 · '+(running?'生成中':'完成')));
  flow.appendChild(who); flow.appendChild(badge);
  m.appendChild(flow);
  const b = el('div','balloon');
  m.appendChild(b);
  msgsEl.appendChild(m);
  assistantBalloon = b;
  currentTurnEl = m;
  scrollToBottom();
  return b;
}
function ensureTurnBubble(){
  if(!assistantBalloon){
    turnSeq += 1;                 // 进入新一轮
    openTurnBubble(turnSeq, true);
  }
  return assistantBalloon;
}
function sealTurn(){
  if(!assistantBalloon || !currentTurnEl) return;
  currentTurnEl.classList.add('done');
  const badge = currentTurnEl.querySelector('.turn-badge');
  if(badge){
    badge.innerHTML='';
    badge.appendChild(el('span','dot stop'));
    badge.appendChild(el('span',null, '第 '+turnSeq+' 轮 · 完成'));
  }
  attachCopyBtn(currentTurnEl, assistantBalloon);   // 轮次结束后提供「复制」按钮
  assistantBalloon = null;
  currentTurnEl = null;
}
/* ---------- 滚动优化 ----------
   流式输出时每个事件都同步 scrollTop 会造成频繁布局刷线；
   这里合并到 requestAnimationFrame 中，一次帧内只滚动一次。 */
let scrollPendingMsgs = false;
let scrollPendingLog = false;
/* —— 智能滚动：用户在底部附近才自动跟随，向上浏览历史时暂停 —— */
const SCROLL_SNAP = 80;   // 距底部多少像素内视为“跟随中”
function nearBottom(el_){ return el_.scrollHeight - el_.scrollTop - el_.clientHeight < SCROLL_SNAP; }
function scrollToBottom(force){
  if(scrollPendingMsgs) return;
  // 非强制（流式输出）且用户正在上翻历史 -> 不打扰
  if(!force && !nearBottom(msgsEl)) return;
  scrollPendingMsgs = true;
  requestAnimationFrame(()=>{
    msgsEl.scrollTop = msgsEl.scrollHeight;
    scrollPendingMsgs = false;
  });
}
function scrollLogDown(force){
  if(scrollPendingLog) return;
  if(!force && !nearBottom(logEl)) return;
  scrollPendingLog = true;
  requestAnimationFrame(()=>{
    logEl.scrollTop = logEl.scrollHeight;
    scrollPendingLog = false;
  });
}

function pushUser(text){
  const m = el('div','msg user');
  m.appendChild(el('div','who','● YOU'));
  m.appendChild(el('div','balloon', text));
  msgsEl.appendChild(m); scrollToBottom(true);
}

/* ---------- 工具卡片：tool_use + tool_result 合并为一张 ---------- */
function toolCall(ev){
  let rec = toolCards.get(ev.id);
  if(rec){ // 同 id 重复到达（理论上不会），直接复用
    rec.card.classList.remove('ready','fail');
    return rec;
  }
  const card = el('div','entry t-card');
  const head = el('div','t-head');
  head.appendChild(el('span','t-ico','⌘'));
  head.appendChild(el('span','t-name','调用工具 · '+(ev.name||'?')));
  const state = el('span','t-state');
  state.appendChild(el('span','spin'));
  state.appendChild(el('span',null,'执行中'));
  head.appendChild(state);
  card.appendChild(head);

  let args='';
  try{ args = JSON.stringify(ev.args||{}, null, 2); }catch(e){ args=String(ev.args); }
  const argsEl = el('div','t-args', args);
  card.appendChild(argsEl);

  const foot = el('div','t-foot');
  const tick = el('span','t-tick','✓');
  const out = el('span','t-out','');
  const hint = el('span','t-hint','');
  foot.appendChild(tick); foot.appendChild(out); foot.appendChild(hint);
  card.appendChild(foot);

  logEl.appendChild(card);
  scrollLogDown();

  rec = { card, argsEl, state, tick, out, hint };
  toolCards.set(ev.id, rec);
  capToolCards(); // 内存保护：清掉过量的已完成卡片
  return rec;
}

function toolResult(ev){
  // 方案核心：按 id 找回"上一轮"创建的卡片，无论中间隔了多少日志
  let rec = toolCards.get(ev.id);
  if(!rec){
    // 兜底：该 result 先于 use 到达（或 use 丢失），新建一张结果卡片
    rec = toolCall({ id: ev.id, name: '?', args: {} });
  }
  const ok = !ev.error;
  rec.card.classList.toggle('ready', ok);
  rec.card.classList.toggle('fail', !ok);
  rec.card.classList.remove('entry');            // 保留 pop 动画已在首帧，避免重复
  rec.tick.textContent = ok ? '✓' : '!';
  rec.out.textContent = (ok?'完成': '出错') + ' · ' + String((ev.output||'').length) + ' 字符';
  rec.state.innerHTML = '';                       // 去掉旋转
  rec.state.append(ok ? '✓ 完成' : '✕ 失败');
  if(ev.error && !rec.hint.textContent && ev.output){
    rec.hint.textContent = '『 '+String(ev.output||'').slice(0,180)+(ev.output&&ev.output.length>180?'…':'')+' 』';
  }
  // 高亮一下，提醒动态已归位
  rec.card.classList.add('flash');
  setTimeout(()=>rec.card.classList.remove('flash'), 600);
  scrollLogDown();
}

/* 把 Agent 的工具类系统日志折叠进"执行中"的卡片，避免刷屏 */
function attachToolLog(msg){
  const trimmed = String(msg||'');
  // 找一张仍在"执行中"（未 ready/fail）的卡片，作为最近工具的归属
  let rec = null;
  for(const r of toolCards.values()){
    if(!r.card.classList.contains('ready') && !r.card.classList.contains('fail')){
      rec = r; break;
    }
  }
  if(!rec){
    // 找不到活跃卡片，补一条便签，仍保留原始信息
    const note = el('div','entry p-note', '⚙ '+trimmed);
    logEl.appendChild(note); scrollLogDown();
    return;
  }
  rec.hint.textContent = trimmed;   // 覆盖式展示最新一条工具日志，保持卡片干净
}

/* 其它需要以"便签/便条/轮次"出现的特殊 Log */
function genericLog(ev){
  const msg = String(ev.message||'');
  // 工具类系统日志 -> 折叠进工具卡片
  if(/\[tool\]/.test(msg)){ attachToolLog(msg); return; }
  const note = el('div','entry p-note', '📝 '+msg);
  logEl.appendChild(note); scrollLogDown();
}
function logTurn(turn){
  const chip = el('div','entry p-turn','第 '+turn+' 轮 · 模型请求完成');
  logEl.appendChild(chip); scrollLogDown();
}
function logWriting(){
  const w = el('div','entry p-wait');
  const d3 = el('span','dot3'); d3.appendChild(el('i')); d3.appendChild(el('i')); d3.appendChild(el('i'));
  w.appendChild(d3);
  w.appendChild(el('span',null,'模型正在生成回复…'));
  logEl.appendChild(w); scrollLogDown();
}
function logError(ev){
  const e = el('div','entry p-error');
  e.appendChild(el('span','err-ico','⚠'));
  e.appendChild(el('span',null, ev.message||'未知错误'));
  logEl.appendChild(e); scrollLogDown();
}

/* ---------- 读取会话（页面加载 / 刷新） ----------
   优先从 localStorage 恢复本地会话；首次使用时若后端已有历史，
   则把它导入成一个会话，方便平滑迁移。 */
async function loadHistory(){
  loadSessions();

  // 本地没有任何会话 -> 尝试从后端历史导入为第一个会话（一次性迁移）
  if(sessions.length === 0){
    try{
      const r = await fetch('/api/history');
      if(r.ok){
        const data = await r.json();
        const list = (data.history||[]).filter(m => m.content);
        if(list.length){
          const messages = [];
          let cur = null;
          for(const it of list){
            if(it.role==='user'){
              cur = { role:'user', content: it.content };
              messages.push(cur);
            } else if(it.role==='assistant'){
              // 连续 assistant 追加为同一条的 turns
              const last = messages[messages.length-1];
              if(last && last.role==='assistant'){ last.turns.push(it.content); }
              else { messages.push({ role:'assistant', turns:[it.content] }); }
            }
          }
          sessions.push({ id:newId(), title:'历史对话', createdAt:Date.now(), messages });
          activeId = sessions[0].id;
          persistSessions();
        }
      }
    }catch(e){ /* 后端不可用时忽略迁移 */ }
  }

  if(!sessions.length) activeId = null;
  renderSessList();
  renderActiveConversation();
}

/* 清空当前会话的全部消息（保留会话，可继续使用） */
function clearCurrentSession(){
  const s = activeSession();
  if(!s) { resetConversation(); return; }
  endStream(); sealTurn();
  s.messages = [];
  activeAssistant = null; curText = '';
  msgsEl.innerHTML = ''; logEl.innerHTML = ''; toolCards.clear();
  turnSeq = 0; assistantBalloon = null; currentTurnEl = null;
  persistSessions(); renderSessList(); showEmpty(); updateSendState();
}

/* 删除全部会话并新建一个空会话（用于删除最后一个会话时） */
function resetConversation(){
  endStream(); sealTurn();
  activeId = null;
  sessions = [];
  activeAssistant = null; curText = '';
  msgsEl.innerHTML = ''; logEl.innerHTML = ''; toolCards.clear();
  turnSeq = 0; assistantBalloon = null; currentTurnEl = null;
  createSession();          // 建一个全新的空会话作为当前
  showEmpty();
}
function showEmpty(){
  const d = el('div','empty');
  d.innerHTML = '<div class="big">🥕</div><h3>任务工作台已就绪</h3><p>在下方输入任务，Agent 会实时推进并把每一步过程展示在这里。</p>';
  msgsEl.appendChild(d);
}

/* ---------- SSE 实时事件 ---------- */
function subscribe(sessionId){
  if(currentES) { currentES.close(); }
  const es = new EventSource('/api/events?session=' + encodeURIComponent(sessionId));
  currentES = es;
  es.onopen = ()=>{ esRetryCount = 0; };
  es.onmessage = (msg)=>{
    let ev; try{ ev=JSON.parse(msg.data); }catch(e){ return; }
    switch(ev.type){
      case 'text':
        ensureTurnBubble().textContent += ev.text;
        curText += ev.text;                 // 累积到本地会话数据
        scrollToBottom(); break;
      case 'tool_call':   toolCall(ev); break;
      case 'tool_result': toolResult(ev); break;
      case 'turn_complete':
        commitTurn();                        // 把本轮文本固化进本地会话
        sealTurn();                          // 封口当前轮，下一轮 text 会新开一轮气泡
        persistSessions();
        logTurn(ev.turn); break;
      case 'log':         genericLog(ev); break;
      case 'error':
        endStream();
        logError(ev); if(ev.message) ensureTurnBubble().textContent += ('\n[错误] '+ev.message);
        commitTurn();
        finishAssistant(ev.message);         // 保存并收口
        finishTurn(); break;
      case 'loop_complete':
        endStream();
        commitTurn();
        finishAssistant();                   // 保存并收口
        finishTurn(); break;
    }
    scrollLogDown();
  };
  /* 服务器发送 event: end 表示会话已结束，主动关闭连接，避免自动重连死循环 */
  es.addEventListener('end', ()=>{
    endStream();
  });
  es.onerror = ()=>{
    // 连接被服务器关闭而会话已结束 -> 直接关闭，不重连
    if(!busy){ endStream(); return; }
    // 会话仍在进行但连接异常 -> 退避重连
    esRetryCount++;
    if(esRetryCount > 10){
      endStream();
      const note = el('div','entry p-error');
      note.appendChild(el('span','err-ico','⚠'));
      note.appendChild(el('span',null,'实时连接中断，请刷新页面重试'));
      logEl.appendChild(note); scrollLogDown();
    }
  };
}
function endStream(){
  if(currentES){
    currentES.close();
    currentES = null;
  }
}

/* 把“当前正在累积的一轮文本”固化进 activeAssistant.turns */
function commitTurn(){
  if(!activeAssistant) return;
  const t = (curText||'').trim();
  curText = '';
  if(t) activeAssistant.turns.push(t);
}

/* Agent 全部运行结束：把聚合好的 assistant 回复写入当前会话并持久化 */
function finishAssistant(errMsg){
  if(activeAssistant){
    commitTurn();
    if(errMsg) activeAssistant.turns.push('[错误] ' + errMsg);
    const s = activeSession();
    if(s){
      const turns = activeAssistant.turns.filter(t=>t&&t.trim());
      if(turns.length) s.messages.push({ role:'assistant', turns });
    }
    activeAssistant = null;
  }
  persistSessions();
  renderSessList();               // 标题可能已用首条消息更新，刷新列表
}
function finishTurn(){
  sealTurn();                       // 确保最后一轮也被封口为“完成”
  turnSeq = 0;                      // 复位，下一条用户消息从第 1 轮重新计
  assistantBalloon = null; currentTurnEl = null;
  setStatus(false); busy=false; updateSendState();
  input.focus();
  document.getElementById('feed').textContent = 'idle';
  esRetryCount = 0;                 // 复位重连计数
}

/* ---------- 发送 ---------- */
async function send(){
  const text = input.value.trim();
  if(!text || busy) return;

  // 保证当前一定有一个会话可写
  let s = activeSession();
  if(!s){ createSession(); s = activeSession(); }

  // 记录用户消息到本地会话，并开启新的 assistant 聚合
  s.messages.push({ role:'user', content:text });
  if(!s.title.startsWith('会话')){ /* 标题已由用户首条消息命名，保持 */ }
  else if(s.messages.length === 1){
    s.title = text.slice(0, 18) + (text.length>18?'…':'');
  }
  activeAssistant = { turns:[] }; curText = '';
  persistSessions(); renderSessList();

  busy = true; sendBtn.disabled = true; setStatus(true); updateSendState();
  pushUser(text); input.value=''; resizeInput(); updateSendState(); document.getElementById('feed').textContent='waiting…';
  document.querySelector('.empty')?.remove();
  sealTurn(); turnSeq = 0;          // 新对话：先封口残留轮次，再复位计数器（避免"第0轮"）
  try{
    const r = await fetch('/api/chat',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:text}) });
    const data = await r.json();
    if(data.error){ throw new Error(data.error); }
    document.getElementById('feed').textContent='streaming…';
    subscribe(data.sessionId);
  }catch(err){
    console.error(err);
    ensureTurnBubble().textContent = '请求失败：'+err.message;
    finishAssistant('请求失败：' + err.message);
    endStream(); finishTurn();
  }
}

/* 清空右侧动态 */
$('#clearLog').addEventListener('click', ()=>{ logEl.innerHTML=''; toolCards.clear(); });

/* 清空当前会话（清空本会话消息，其他会话不受影响） */
$('#clearMsgs').addEventListener('click', ()=>{
  if(confirm('清空当前会话的全部消息？')){
    clearCurrentSession();
  }
});

/* 新建会话 */
$('#newSession').addEventListener('click', ()=> createSession());

/* 导出全部会话为 JSON 备份文件 */
$('#exportSess').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(sessions, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mycoder-sessions-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* 从备份 JSON 导入会话 */
$('#importSess').addEventListener('click', ()=> $('#importFile').click());
$('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('不是合法的会话备份');
      const valid = data.filter(s => s && typeof s.id==='string' && Array.isArray(s.messages));
      if(!valid.length) throw new Error('备份中没有有效会话');
      // 追加导入，避免覆盖本地；重名会让步
      valid.forEach(s=>{ s.id = newId(); });
      sessions = sessions.concat(valid);
      persistSessions();
      renderSessList();
      switchSession(valid[0].id);
      alert('已导入 ' + valid.length + ' 个会话');
    }catch(err){ alert('导入失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* -------- 发送按钮：点击 / 键盘触发 --------
   此前 #sendBtn 只被 Enter 键暗含调用，鼠标点击从未绑定到 send()，
   导致复制粘贴后想点「发送」按钮无效。这里显式绑定 click。 */
sendBtn.addEventListener('click', ()=> send());
sendBtn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); send(); } });

/* 根据「是否有内容 & 是否忙碌」同步发送按钮的可点/视觉状态 */
function updateSendState(){
  const has = !!input.value.trim();
  sendBtn.disabled = busy || !has;
  sendBtn.classList.toggle('empty', !has);
}
input.addEventListener('input', updateSendState);
input.addEventListener('paste', ()=>{ setTimeout(updateSendState,0); });

/* —— “回到底部”悬浮按钮 —— */
const jumpDown = $('#jumpDown');
msgsEl.addEventListener('scroll', ()=>{ jumpDown.classList.toggle('show', !nearBottom(msgsEl)); });
jumpDown.addEventListener('click', ()=>{ scrollToBottom(true); jumpDown.classList.remove('show'); msgsEl.focus(); });

/* 页面关闭 / 刷新前：收口未结束的流式内容并保存，释放 SSE */
window.addEventListener('beforeunload', ()=>{
  if(activeAssistant && (curText || (activeAssistant.turns&&activeAssistant.turns.length))) stopAndFreeze();
  else endStream();
});

/* 初始化：加载本地会话；若本地与后端都没有会话，则新建一个空会话 */
loadHistory().then(()=>{
  if(!activeSession()) createSession();
  renderSessList();
  updateSendState();            // 初始同步发送按钮状态（空输入不可点）
});
</script>
</body>
</html>
